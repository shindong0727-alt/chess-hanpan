<html lang="ko">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>체스 한판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%94%E2%99%95%E2%99%96%E2%99%97%E2%99%98%E2%99%99%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F&display=block">
<style>
/* Layout: club-room board on the left (top on phones), a scoresheet-style panel beside it. */
:root {
  --bg: #e6e9e3;
  --surface: #f5f6f2;
  --ink: #1b211e;
  --muted: #5b655e;
  --line: #c8cec6;
  --accent: #22506f;
  --accent-ink: #ffffff;
  --sq-light: #e8e2cc;
  --sq-dark: #708b6b;
  --coord-on-light: #5d7659;
  --coord-on-dark: #eef0e2;
  --last: rgba(214, 178, 48, 0.42);
  --sel: rgba(34, 80, 111, 0.45);
  --dot: rgba(27, 33, 30, 0.28);
  --check: rgba(196, 52, 38, 0.85);
  --piece-w: #fbfaf4;
  --piece-w-line: #1c1f1c;
  --piece-b: #24292b;
  --danger: #a23a2a;
  --shadow: 0 1px 2px rgba(20, 30, 25, .08), 0 8px 24px rgba(20, 30, 25, .10);
  --f-display: "Young Serif", "Noto Serif KR", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-piece: "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201c; --ink: #e5eae6; --muted: #98a39c; --line: #2b3530;
    --accent: #86b6d8; --accent-ink: #0f1a22;
    --sq-light: #cdc7af; --sq-dark: #5a7556; --coord-on-light: #4f6a4c; --coord-on-dark: #e4e7d6;
    --last: rgba(214, 178, 48, 0.45); --sel: rgba(134, 182, 216, 0.55); --dot: rgba(10, 14, 12, 0.35);
    --danger: #e0806e; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201c; --ink: #e5eae6; --muted: #98a39c; --line: #2b3530;
  --accent: #86b6d8; --accent-ink: #0f1a22;
  --sq-light: #cdc7af; --sq-dark: #5a7556; --coord-on-light: #4f6a4c; --coord-on-dark: #e4e7d6;
  --last: rgba(214, 178, 48, 0.45); --sel: rgba(134, 182, 216, 0.55); --dot: rgba(10, 14, 12, 0.35);
  --danger: #e0806e; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 980px; margin: 0 auto; align-items: start; }
@media (min-width: 880px) { .app { grid-template-columns: minmax(0, 1fr) 340px; } }
/* The board size depends only on the screen width, never on its content. */
:root { --bsize: min(560px, calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px)))); }
@media (min-width: 880px) { :root { --bsize: min(560px, calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px)) - 360px)); } }

.boardcol { display: grid; gap: 8px; min-width: 0; width: 100%; justify-items: center; }
.bar { width: var(--bsize); max-width: 100%; overflow: hidden; display: flex; align-items: center; gap: 10px; min-height: 34px; }
.bar .who { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.bar .chip { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--piece-w-line); flex: none; }
.bar .chip.w { background: var(--piece-w); }
.bar .chip.b { background: var(--piece-b); border-color: var(--piece-b); }
.bar .caps { font-family: var(--f-piece); font-size: 17px; letter-spacing: -2px; color: var(--muted); line-height: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
.bar .adv { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.bar .turn { margin-left: auto; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.bar .turn[hidden] { display: none; }

.boardwrap { position: relative; width: var(--bsize); height: var(--bsize); max-width: 100%; flex: none; }
.board {
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); width: 100%; height: 100%;
  border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); container-type: inline-size;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.sq { position: relative; border: 0; padding: 0; margin: 0; min-width: 0; min-height: 0; overflow: hidden; background: var(--sq-light); display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.sq.d { background: var(--sq-dark); }
.sq.last::before, .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--last); }
.sq.sel::before { background: var(--sel); }
.sq.check::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--check) 0%, rgba(196,52,38,.35) 45%, transparent 72%); }
.sq .dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); z-index: 3; pointer-events: none; }
.sq .ring { position: absolute; inset: 5%; border-radius: 50%; border: 0.9cqw solid var(--dot); z-index: 3; pointer-events: none; }
.sq .cf, .sq .cr { position: absolute; font-family: var(--f-mono); font-size: 2.1cqw; font-weight: 600; line-height: 1; z-index: 1; pointer-events: none; }
.sq .cf { right: 4%; bottom: 4%; }
.sq .cr { left: 5%; top: 5%; }
.sq .cf, .sq .cr { color: var(--coord-on-light); }
.sq.d .cf, .sq.d .cr { color: var(--coord-on-dark); }
.pc { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; font-family: var(--f-piece); font-size: 10.4cqw; line-height: 1; pointer-events: none; }
.pc i, .pc b { grid-area: 1 / 1; font-style: normal; font-weight: 400; }
.pc.w i { color: var(--piece-w); }
.pc.w b { color: var(--piece-w-line); }
.pc.b i, .pc.b b { color: var(--piece-b); }
.pc.b i { filter: drop-shadow(0 0 0.15cqw rgba(255,255,255,.35)); }
.pc.arrive { animation: arrive .18s ease-out; }
@keyframes arrive { from { transform: scale(.82); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pc.arrive { animation: none; } }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 20, 18, .42); border-radius: 6px; z-index: 10; padding: 16px; }
.card { background: var(--surface); color: var(--ink); border-radius: 10px; padding: 20px; box-shadow: var(--shadow); width: min(320px, 100%); display: grid; gap: 12px; text-align: center; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.promo button { position: relative; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--sq-light); cursor: pointer; container-type: inline-size; padding: 0; }
.promo .pc { font-size: 78cqw; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 20px; min-width: 0; }
.brand { display: grid; gap: 2px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.sec { display: grid; gap: 10px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 18px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.label { font-size: 13px; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 9px 6px; cursor: pointer; font-size: 14px; display: grid; gap: 0; line-height: 1.25; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button small { font-size: 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .85; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 18px; letter-spacing: .18em; text-transform: uppercase; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.note.err { color: var(--danger); }

.status { font-family: var(--f-display); font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.codebox { display: grid; gap: 6px; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); }
.codebox .code { font-family: var(--f-mono); font-size: 30px; font-weight: 600; letter-spacing: .22em; user-select: all; -webkit-user-select: all; }
.codebox .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.moves { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.moves ol { list-style: none; margin: 0; padding: 6px 0; display: grid; }
.moves li { display: grid; grid-template-columns: 3em 1fr 1fr; padding: 2px 12px; }
.moves li:nth-child(even) { background: color-mix(in srgb, var(--line) 30%, transparent); }
.moves .n { color: var(--muted); }
.moves .cur { font-weight: 600; color: var(--accent); }
.moves .empty { padding: 12px; color: var(--muted); font-family: var(--f-body); font-size: 13px; }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="boardcol">
    <div class="bar" id="barTop"></div>
    <div class="boardwrap">
      <div class="board" id="board" role="grid" aria-label="체스판"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <div class="bar" id="barBottom"></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<script>
function ChessEngine() {
  // 0x88 board. row 0 = rank 8. piece: type 1..6 (P N B R Q K), +8 for black.
  var P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6, BLACK = 8;
  var KN = [-33, -31, -18, -14, 14, 18, 31, 33];
  var KG = [-17, -16, -15, -1, 1, 15, 16, 17];
  var DI = [-17, -15, 15, 17];
  var OR = [-16, -1, 1, 16];
  var VAL = [0, 100, 320, 330, 500, 900, 0];
  var PST = {
    1: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    2: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    3: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    4: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    5: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    6: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
    7: [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50]
  };
  var CMASK = new Int8Array(128);
  for (var i = 0; i < 128; i++) CMASK[i] = 15;
  CMASK[116] = 12; CMASK[119] = 14; CMASK[112] = 13; CMASK[4] = 3; CMASK[7] = 11; CMASK[0] = 7;

  // zobrist
  var seed = 1234567;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed >>> 0; }
  var ZP = [], ZC = [], ZE = [], ZS = rnd();
  for (i = 0; i < 16 * 128; i++) ZP.push(rnd());
  for (i = 0; i < 16; i++) ZC.push(rnd());
  for (i = 0; i < 128; i++) ZE.push(rnd());

  var b = new Int8Array(128), side = 0, castle = 0, ep = -1, half = 0, full = 1, hash = 0;
  var kings = [0, 0];
  var stack = []; // undo
  var hist = []; // hashes of previous positions

  function sqName(s) { return 'abcdefgh'[s & 7] + (8 - (s >> 4)); }
  function nameSq(n) { return (8 - parseInt(n[1], 10)) * 16 + 'abcdefgh'.indexOf(n[0]); }

  function computeHash() {
    var h = 0;
    for (var s = 0; s < 128; s++) { if (s & 0x88) { s += 7; continue; } if (b[s]) h ^= ZP[b[s] * 128 + s]; }
    h ^= ZC[castle]; if (ep >= 0) h ^= ZE[ep]; if (side) h ^= ZS;
    return h >>> 0;
  }

  function load(fen) {
    var parts = fen.trim().split(/\s+/);
    b.fill(0);
    var rows = parts[0].split('/');
    for (var r = 0; r < 8; r++) {
      var c = 0;
      for (var j = 0; j < rows[r].length; j++) {
        var ch = rows[r][j];
        if (ch >= '1' && ch <= '8') { c += +ch; continue; }
        var t = 'pnbrqk'.indexOf(ch.toLowerCase()) + 1;
        var p = t | (ch === ch.toLowerCase() ? BLACK : 0);
        b[r * 16 + c] = p;
        if (t === K) kings[p & BLACK ? 1 : 0] = r * 16 + c;
        c++;
      }
    }
    side = parts[1] === 'b' ? BLACK : 0;
    castle = 0;
    var cs = parts[2] || '-';
    if (cs.indexOf('K') >= 0) castle |= 1; if (cs.indexOf('Q') >= 0) castle |= 2;
    if (cs.indexOf('k') >= 0) castle |= 4; if (cs.indexOf('q') >= 0) castle |= 8;
    ep = parts[3] && parts[3] !== '-' ? nameSq(parts[3]) : -1;
    half = parts[4] ? +parts[4] : 0; full = parts[5] ? +parts[5] : 1;
    stack = []; hist = [];
    hash = computeHash();
  }

  function fen() {
    var out = '';
    for (var r = 0; r < 8; r++) {
      var e = 0;
      for (var c = 0; c < 8; c++) {
        var p = b[r * 16 + c];
        if (!p) { e++; continue; }
        if (e) { out += e; e = 0; }
        var ch = ' pnbrqk'[p & 7];
        out += p & BLACK ? ch : ch.toUpperCase();
      }
      if (e) out += e;
      if (r < 7) out += '/';
    }
    var cs = (castle & 1 ? 'K' : '') + (castle & 2 ? 'Q' : '') + (castle & 4 ? 'k' : '') + (castle & 8 ? 'q' : '');
    return out + ' ' + (side ? 'b' : 'w') + ' ' + (cs || '-') + ' ' + (ep >= 0 ? sqName(ep) : '-') + ' ' + half + ' ' + full;
  }

  function attacked(sq, by) { // by: 0 or BLACK
    var s, i, p, d;
    if (by === 0) {
      s = sq + 15; if (!(s & 0x88) && b[s] === P) return true;
      s = sq + 17; if (!(s & 0x88) && b[s] === P) return true;
    } else {
      s = sq - 15; if (!(s & 0x88) && b[s] === (P | BLACK)) return true;
      s = sq - 17; if (!(s & 0x88) && b[s] === (P | BLACK)) return true;
    }
    for (i = 0; i < 8; i++) {
      s = sq + KN[i]; if (!(s & 0x88) && b[s] === (N | by)) return true;
      s = sq + KG[i]; if (!(s & 0x88) && b[s] === (K | by)) return true;
    }
    for (i = 0; i < 4; i++) {
      d = DI[i]; s = sq + d;
      while (!(s & 0x88)) { p = b[s]; if (p) { if (p === (B | by) || p === (Q | by)) return true; break; } s += d; }
      d = OR[i]; s = sq + d;
      while (!(s & 0x88)) { p = b[s]; if (p) { if (p === (R | by) || p === (Q | by)) return true; break; } s += d; }
    }
    return false;
  }

  function inCheck() { return attacked(kings[side ? 1 : 0], side ^ BLACK); }

  // move int: from | to<<7 | promo<<14 | flags<<17 ; flags 1 cap, 2 ep, 4 castle, 8 double
  function mv(f, t, pr, fl) { return f | (t << 7) | (pr << 14) | (fl << 17); }
  function mFrom(m) { return m & 127; }
  function mTo(m) { return (m >> 7) & 127; }
  function mPromo(m) { return (m >> 14) & 7; }
  function mFlags(m) { return (m >> 17) & 15; }

  function gen(list, capsOnly) {
    var us = side, them = side ^ BLACK, s, p, t, d, i, to, q;
    for (s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      p = b[s]; if (!p || (p & BLACK) !== us) continue;
      t = p & 7;
      if (t === P) {
        var dir = us ? 16 : -16, startRow = us ? 1 : 6, lastRow = us ? 7 : 0;
        to = s + dir;
        if (!(to & 0x88) && !b[to]) {
          if ((to >> 4) === lastRow) { for (q = Q; q >= N; q--) list.push(mv(s, to, q, 0)); }
          else if (!capsOnly) {
            list.push(mv(s, to, 0, 0));

  }
  function joinOnline(code) {
    code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 5) { lobbyError('초대 코드는 5자리예요.'); return; }
    if (S.busy) return;
    S.busy = true; S.lobbyMsg = '대국을 찾고 있어요…'; S.lobbyErr = false; render();
    var t = makeTransport(code);
    t.get().then(function (doc) {
      if (!doc) { t.close(); lobbyError('코드 ' + code + '에 해당하는 대국이 없어요. 코드를 다시 확인해 주세요.'); return; }
      var seat = doc.white === ME ? 'w' : doc.black === ME ? 'b' : null;
      var patch = null;
      if (!seat) { if (!doc.white) patch = { white: ME }; else if (!doc.black) patch = { black: ME }; }
      if (patch) {
        Object.assign(doc, patch);
        return t.write(patch).then(function () { startOnline(t, code, doc); });
      }
      startOnline(t, code, doc);
    }).catch(function (e) {
      t.close();
      lobbyError(e && e.code === 'invalid_argument' ? '이 페이지의 편집 권한이 있어야 대국에 참가할 수 있어요.' : '대국에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
    });
  }
  function resumePeer(saved) {
    if (!saved.host) { joinOnline(saved.code); return; }
    S.busy = true; S.lobbyMsg = '진행 중이던 대국을 다시 여는 중…'; S.lobbyErr = false; render();
    var t = peerTransport(saved.code);
    t.create(saved.doc).then(function () { startOnline(t, saved.code, saved.doc); }, function () {
      store(SESSION_KEY, undefined);
      lobbyError('진행 중이던 대국을 다시 열지 못했어요. 새 대국을 만들어 주세요.');
    });
  }
  function resign() {
    if (!S.confirmResign) { S.confirmResign = true; render(); setTimeout(function () { if (S.confirmResign) { S.confirmResign = false; render(); } }, 3000); return; }
    S.confirmResign = false;
    var r = { over: true, type: 'resign', winner: opp(S.myColor) };
    if (S.mode === 'ai') { aiReq++; S.thinking = false; S.result = r; saveAi(); render(); }
    else { S.result = r; render(); S.online.t.write({ result: r, updated: Date.now() }); }
  }
  function rematch() {
    var d = S.online.doc;
    S.online.t.write({ white: d.black, black: d.white, moves: [], result: null, round: (d.round || 1) + 1, updated: Date.now() });
  }
  function toLobby() {
    leaveOnline(); aiReq++; S.thinking = false;
    S.screen = 'lobby'; S.mode = null; S.moves = []; S.result = null; S.promo = null; clearSel();
    S.busy = false; S.lobbyMsg = ''; S.lobbyErr = false;
    store(SESSION_KEY, undefined);
    replay(); render();
  }

  // ---------- events ----------
  el('board').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sq]'); if (b) clickSquare(b.getAttribute('data-sq'));
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var seg = b.getAttribute('data-seg');
    if (seg) { S.pick[seg] = b.getAttribute('data-val'); render(); return; }
    var pr = b.getAttribute('data-promo');
    if (pr && S.promo) { var u = S.promo.from + S.promo.to + pr; S.promo = null; clearSel(); playMove(u); return; }
    var act = b.getAttribute('data-act');
    if (!act) return;
    if (act === 'start-ai') startAi();
    else if (act === 'create') createOnline();
    else if (act === 'promo-cancel') { S.promo = null; clearSel(); render(); }
    else if (act === 'flip') { S.flipped = !S.flipped; render(); }
    else if (act === 'undo') undo();
    else if (act === 'resign') resign();
    else if (act === 'again') { S.pick.level = S.level; S.pick.aiColor = S.myColor; startAi(); }
    else if (act === 'rematch') rematch();
    else if (act === 'review') { S.overlayClosed = true; render(); }
    else if (act === 'lobby') toLobby();
    else if (act === 'copy') {
      var code = S.online && S.online.code;
      var done = function () { S.copied = true; render(); setTimeout(function () { S.copied = false; render(); }, 1500); };
      try {
        navigator.clipboard.writeText(code).then(done, function () { selectCode(); });
      } catch (err) { selectCode(); }
    }
  });
  function selectCode() {
    var n = el('codeText'); if (!n) return;
    var r = document.createRange(); r.selectNodeContents(n);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'joinForm') { e.preventDefault(); joinOnline(el('joinCode').value); }
  });

  // ---------- boot ----------
  replay(); render();
  var saved = load(SESSION_KEY);
  if (saved && saved.mode === 'ai' && Array.isArray(saved.moves)) {
    S.screen = 'game'; S.mode = 'ai'; S.level = saved.level || 'normal'; S.myColor = saved.myColor === 'b' ? 'b' : 'w';
    S.moves = saved.moves; S.result = saved.result || null; replay(); render(); requestAi();
  }
  var useP = window.claude && typeof window.claude.use === 'function' ? window.claude.use('db') : Promise.resolve(null);
  Promise.resolve(useP).catch(function () { return null; }).then(function (ns) {
    dbNS = ns || null;
    S.onlineState = dbNS ? 'db' : 'peer';
    if (saved && saved.mode === 'online' && saved.code && dbNS && S.screen === 'lobby') joinOnline(saved.code);
    else if (saved && saved.mode === 'peer' && saved.code && !dbNS && S.screen === 'lobby') resumePeer(saved);
    else render();
  });
})();
</script>
</body>
</html>
